<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Game Night Admin</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1f2328;--muted:#656d76;--line:#d8d4cc;--accent:#2f6f5e;--on-accent:#fff;--bad:#b3261e;--ok:#1f6b3a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--card:#1f2224;--ink:#ecebe8;--muted:#9aa0a6;--line:#363a3d;--accent:#5fb89f;--on-accent:#0d1b16;--bad:#f2867f;--ok:#7fd49b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.5rem;margin:.5rem 0}h2{font-size:1.15rem;margin:0 0 .6rem}
.sub{color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:1rem 0}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .8rem;min-height:2.5rem;cursor:pointer}
button.primary{background:var(--accent);color:var(--on-accent);border:0;font-weight:600}
button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem;min-height:2.5rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row>input{flex:1 1 10rem}
table{width:100%;border-collapse:collapse}td,th{padding:.4rem .3rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.note{padding:.6rem .8rem;border-radius:8px;border:1px solid var(--line)}
.note.bad{color:var(--bad);border-color:var(--bad)}.note.ok{color:var(--ok);border-color:var(--ok)}
.off{opacity:.55}
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script>
const C = window.GNM_CONFIG || {};
const app = document.getElementById('app');
let jwt = null;
try { jwt = sessionStorage.getItem('gnm_jwt'); } catch {}

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
const note = (t, c = '') => h('p', { class: 'note ' + c, role: 'status' }, t);

async function api(path, { method = 'GET', body, prefer, auth } = {}) {
  const headers = { 'Content-Type': 'application/json', apikey: C.SUPABASE_KEY };
  if (auth !== false && jwt) headers.Authorization = 'Bearer ' + jwt;
  if (prefer) headers.Prefer = prefer;
  const r = await fetch(C.SUPABASE_URL + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch {}
  if (r.status === 401) { jwt = null; try { sessionStorage.removeItem('gnm_jwt'); } catch {} throw new Error('session_expired'); }
  if (!r.ok) throw new Error((data && (data.message || data.msg || data.error_description)) || 'request_failed');
  return data;
}
const rest = (p, o) => api('/rest/v1/' + p, o);
const rpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args });

const ymd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => ymd(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtMonth = s => ymd(s).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const siteBase = () => location.origin + location.pathname.replace(/[^/]*$/, '');

// ---------- login ----------
function showLogin(err) {
  const email = h('input', { type: 'email', autocomplete: 'username', placeholder: 'Email' });
  const pw = h('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Password' });
  const out = h('div', {}, err ? note(err, 'bad') : null);
  const go = async () => {
    try {
      const d = await api('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: email.value.trim(), password: pw.value }, auth: false });
      jwt = d.access_token;
      try { sessionStorage.setItem('gnm_jwt', jwt); } catch {}
      render();
    } catch { out.replaceChildren(note('Sign-in failed. Check your email and password.', 'bad')); }
  };
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  app.replaceChildren(h('h1', {}, 'Game Night Admin'), h('section', {}, h('div', { class: 'row' }, email), h('div', { class: 'row' }, pw), h('button', { class: 'primary', type: 'button', onclick: go }, 'Sign in'), out));
}

// ---------- main view ----------
async function render(msgNode) {
  if (!C.SUPABASE_URL || !C.SUPABASE_KEY) return app.replaceChildren(note('config.js isn’t filled in yet.', 'bad'));
  if (!jwt) return showLogin();
  try {
    const [attendees, settingsArr, events] = await Promise.all([
      rest('attendees?select=*&order=name'),
      rest('app_settings?select=*&id=eq.1'),
      rest('events?select=*&status=neq.cancelled&order=month.desc&limit=1')]);
    const ev = events[0] || null;
    let extra = { progress: null, results: [], invites: [], signups: [], ballots: [] };
    if (ev) {
      const q = `event_id=eq.${ev.id}`;
      const [p, r, i, s, bl] = await Promise.all([
        rest(`poll_progress?select=*&${q}`), rest(`poll_results?select=*&${q}&order=option_date`),
        rest(`invitations?select=status,attendee_id,attendees(name)&${q}`), rest(`signups?select=role,details,address,attendees(name)&${q}&order=created_at`),
        rest(`ballots?select=attendee_id,attendees(name)&${q}`)]);
      extra = { progress: p[0], results: r, invites: i, signups: s, ballots: bl };
    }
    app.replaceChildren(
      h('div', { class: 'row' }, h('h1', { style: 'flex:1' }, 'Game Night Admin'), h('button', { type: 'button', onclick: () => { jwt = null; try { sessionStorage.removeItem('gnm_jwt'); } catch {} showLogin(); } }, 'Sign out')),
      msgNode || '', eventSection(ev, extra, settingsArr[0]), rosterSection(attendees), settingsSection(settingsArr[0]));
  } catch (e) {
    if (e.message === 'session_expired') return showLogin('Your session expired. Please sign in again.');
    app.replaceChildren(h('h1', {}, 'Game Night Admin'), note('Couldn’t load data: ' + e.message, 'bad'), h('button', { type: 'button', onclick: () => render() }, 'Retry'));
  }
}

// Run an action, then re-render with a success or error note
async function act(fn, okText) {
  try { await fn(); await render(note(okText, 'ok')); }
  catch (e) { if (e.message === 'session_expired') showLogin('Your session expired. Please sign in again.'); else await render(note(e.message, 'bad')); }
}

// ---------- event ----------
function eventSection(ev, x, settings) {
  const sec = h('section', {}, h('h2', {}, 'This month’s game day'));
  if (!ev) {
    const t = new Date(); const nm = new Date(t.getFullYear(), t.getMonth() + 1, 1);
    const month = h('input', { type: 'month', value: iso(nm).slice(0, 7) });
    sec.append(h('p', { class: 'sub' }, 'No event yet. Normally the scheduled job creates it on the last Sunday of the month; you can also start one now.'),
      h('div', { class: 'row' }, month, h('button', { class: 'primary', type: 'button', onclick: () => act(() => createEvent(month.value + '-01', settings), 'Poll created.') }, 'Create poll')));
    return sec;
  }
  sec.append(h('p', {}, h('strong', {}, fmtMonth(ev.month)), ' · ', ev.status === 'scheduled' ? 'Scheduled for ' + fmtDate(ev.chosen_date) : 'Poll open'));
  if (x.progress) sec.append(h('p', {}, `${x.progress.responded} of ${x.progress.total_attendees} have responded` + (x.progress.majority_reached ? ' (majority reached).' : ' (no majority yet).')));
  const t = h('table', {}, h('tr', {}, h('th', {}, 'Date'), h('th', {}, 'Yes'), h('th', {}, 'No'), h('th', {}, '')));
  const win = [...x.results].sort((a, b) => b.yes_count - a.yes_count || a.option_date.localeCompare(b.option_date))[0];
  x.results.forEach(r => t.append(h('tr', {}, h('td', {}, fmtDate(r.option_date), win && win.option_id === r.option_id ? ' ★' : ''), h('td', {}, r.yes_count), h('td', {}, r.no_count),
    h('td', {}, h('button', { type: 'button', onclick: () => { if (confirm(`Lock in ${fmtDate(r.option_date)}? This sets the invitation list.`)) act(() => rpc('admin_schedule_event', { p_event_id: ev.id, p_option_id: r.option_id }), 'Date locked in.'); } }, ev.status === 'scheduled' ? 'Use instead' : 'Lock in')))));
  sec.append(t, h('p', { class: 'sub' }, '★ = current leader (most yes votes, ties go to the earliest date). The scheduled job will not send email until it is built.'));
  if (ev.status === 'scheduled') {
    const st = h('input', { type: 'time', value: (ev.start_time || '').slice(0, 5) });
    const loc = h('input', { type: 'text', placeholder: 'Address', value: ev.location || '' });
    const nt = h('input', { type: 'text', placeholder: 'Notes', value: ev.notes || '' });
    sec.append(h('h2', { style: 'margin-top:1rem' }, 'Details'), h('div', { class: 'row' }, st, loc, nt),
      h('button', { type: 'button', onclick: () => act(() => rest(`events?id=eq.${ev.id}`, { method: 'PATCH', body: { start_time: st.value || null, location: loc.value || null, notes: nt.value || null } }), 'Details saved.') }, 'Save details'));
    const inv = x.invites, nm = s => s.attendees ? s.attendees.name : '?';
    sec.append(h('p', {}, ev.invites_sent_at ? 'Invitations marked as sent, so guests who replied yes can see the address. ' : 'Invitations not marked as sent, so the address is hidden from guests. ',
        ev.invites_sent_at ? null : h('button', { class: 'primary', type: 'button', onclick: () => act(() => rpc('admin_mark_invites_sent', { p_event_id: ev.id }), 'Marked as sent.') }, 'Mark invitations as sent')),
      h('h2', { style: 'margin-top:1rem' }, 'Invited and volunteers'),
      h('p', {}, `Coming: ${inv.filter(i => i.status === 'yes').map(nm).join(', ') || 'none yet'}`),
      h('p', {}, `Haven’t replied: ${inv.filter(i => i.status === 'pending').map(nm).join(', ') || 'no one'}`),
      h('p', {}, `Declined the invitation: ${inv.filter(i => i.status === 'declined').map(nm).join(', ') || 'no one'}`),
      h('p', {}, `Voted no on this date (not invited): ${x.ballots.filter(b => !inv.some(i => i.attendee_id === b.attendee_id)).map(nm).join(', ') || 'no one'}`),
      h('p', {}, x.signups.length ? x.signups.map(s => `${s.role}: ${nm(s)}${s.details ? ' (' + s.details + ')' : ''}${s.address ? ' @ ' + s.address : ''}`).join(' · ') : 'No volunteers yet.'));
  }
  sec.append(h('p', {}, h('button', { class: 'danger', type: 'button', onclick: () => { if (confirm('Cancel this month’s event? The poll and its data stay in the database.')) act(() => rest(`events?id=eq.${ev.id}`, { method: 'PATCH', body: { status: 'cancelled' } }), 'Event cancelled.'); } }, 'Cancel this event')));
  return sec;
}

async function createEvent(monthStr, settings) {
  const first = ymd(monthStr);
  const days = [];
  for (let d = new Date(first); d.getMonth() === first.getMonth(); d.setDate(d.getDate() + 1)) if (d.getDay() === 6) days.push(iso(d));
  const closes = new Date(Date.now() + (settings ? settings.poll_window_days : 7) * 864e5).toISOString();
  const [e] = await rest('events', { method: 'POST', prefer: 'return=representation', body: { month: monthStr, poll_closes_at: closes } });
  await rest('date_options', { method: 'POST', body: days.map(d => ({ event_id: e.id, option_date: d })) });
}

// ---------- roster ----------
function rosterSection(list) {
  const name = h('input', { type: 'text', placeholder: 'Name' });
  const email = h('input', { type: 'email', placeholder: 'Email' });
  const t = h('table', {});
  list.forEach(a => t.append(h('tr', { class: a.active ? '' : 'off' }, h('td', {}, a.name, h('br'), h('span', { class: 'sub' }, a.email)),
    h('td', {}, h('button', { type: 'button', onclick: async e => { try { await navigator.clipboard.writeText(`${siteBase()}?t=${a.token}`); e.target.textContent = 'Copied'; } catch { prompt('Copy this link:', `${siteBase()}?t=${a.token}`); } } }, 'Copy link')),
    h('td', {}, h('button', { type: 'button', onclick: () => act(() => rest(`attendees?id=eq.${a.id}`, { method: 'PATCH', body: { active: !a.active } }), a.active ? 'Deactivated.' : 'Reactivated.') }, a.active ? 'Deactivate' : 'Reactivate')),
    h('td', {}, h('button', { class: 'danger', type: 'button', onclick: () => { if (confirm(`Delete ${a.name} and their votes?`)) act(() => rest(`attendees?id=eq.${a.id}`, { method: 'DELETE' }), 'Deleted.'); } }, 'Delete')))));
  return h('section', {}, h('h2', {}, `Attendees (${list.filter(a => a.active).length} active)`),
    list.length ? t : h('p', { class: 'sub' }, 'No attendees yet.'),
    h('div', { class: 'row' }, name, email, h('button', { class: 'primary', type: 'button', onclick: () => act(() => rest('attendees', { method: 'POST', body: { name: name.value.trim(), email: email.value.trim() } }), 'Attendee added.') }, 'Add')));
}

// ---------- settings ----------
function settingsSection(s) {
  const st = h('input', { type: 'time', value: s.default_start_time.slice(0, 5) });
  const loc = h('input', { type: 'text', placeholder: 'Default address', value: s.default_location });
  const nt = h('input', { type: 'text', placeholder: 'Default notes', value: s.default_notes });
  const win = h('input', { type: 'number', min: 1, max: 30, value: s.poll_window_days, style: 'width:5rem;flex:0 0 auto' });
  return h('section', {}, h('h2', {}, 'Defaults for new events'), h('div', { class: 'row' }, st, loc, nt),
    h('div', { class: 'row' }, h('label', {}, 'Days to vote: '), win,
      h('button', { type: 'button', onclick: () => act(() => rest('app_settings?id=eq.1', { method: 'PATCH', body: { default_start_time: st.value, default_location: loc.value, default_notes: nt.value, poll_window_days: Number(win.value), updated_at: new Date().toISOString() } }), 'Defaults saved.') }, 'Save defaults')));
}

render();
</script>
</body>
</html>
